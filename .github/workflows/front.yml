name: Storefront

on:
  push:
    branches:
      - main
    paths:
      - 'front/**'
      - '.github/workflows/front.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: Install pnpm
        run: npm i -g pnpm@10

      - name: Install dependencies
        run: pnpm i --frozen

      - name: Run lint
        run: pnpm lint

  publish:
    name: Publish storefront image
    runs-on: ubuntu-latest
    needs: lint
    environment: dev
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ github.repository }}/front

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./front
          file: ./front/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare deploy metadata
        id: deploy
        run: |
          commit_title="$(git log -1 --pretty=%s "$GITHUB_SHA")"
          short_sha="${GITHUB_SHA::7}"
          echo "name=web-store front: ${commit_title} (${short_sha})" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_NAME}:sha-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
          DEPLOY_NAME: ${{ steps.deploy.outputs.name }}
          FRONT_IMAGE: ${{ steps.deploy.outputs.image }}
        run: |
          gh workflow run deploy.yml \
            --repo h2bc/web-store-deploy \
            --ref main \
            --field name="$DEPLOY_NAME" \
            --field front_image="$FRONT_IMAGE"
