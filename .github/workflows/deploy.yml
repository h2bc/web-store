name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            api/pnpm-lock.yaml
            front/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm i --frozen && pnpm install:api && pnpm install:front

      - name: Lint
        run: pnpm lint:api && pnpm lint:front

      - name: Typecheck
        run: pnpm typecheck && pnpm typecheck:api && pnpm typecheck:front

      - name: Unit tests
        run: pnpm test:front

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medusa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa
      DISABLE_MEDUSA_ADMIN: 'true'
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:3000,http://localhost:9000
      JWT_SECRET: ci
      COOKIE_SECRET: ci
      MEDUSA_BACKEND_URL: http://localhost:9000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            api/pnpm-lock.yaml
            front/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm i --frozen && pnpm install:api && pnpm install:front

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run migrations
        run: pnpm migrate

      - name: Seed database
        run: pnpm --dir api seed

      - name: Export storefront credentials
        run: |
          echo "MEDUSA_PUBLISHABLE_KEY=$(psql "$DATABASE_URL" -tAc "select token from api_key where type = 'publishable' limit 1")" >> "$GITHUB_ENV"

      - name: Run Playwright
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  build-api:
    name: Publish API image
    if: github.event_name != 'pull_request'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ github.repository }}/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-front:
    name: Publish storefront image
    if: github.event_name != 'pull_request'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ github.repository }}/front
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./front
          file: ./front/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=front
          cache-to: type=gha,mode=max,scope=front

  deploy:
    name: Trigger deploy
    runs-on: ubuntu-latest
    needs: [build-api, build-front]
    environment: dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          commit_title="$(git log -1 --pretty=%s "$GITHUB_SHA")"
          short_sha="${GITHUB_SHA::7}"
          gh workflow run deploy.yml \
            --repo h2bc/web-store-deploy \
            --ref main \
            --field name="web-store: ${commit_title} (${short_sha})" \
            --field api_image="${REGISTRY}/${{ github.repository }}/api:sha-${short_sha}" \
            --field front_image="${REGISTRY}/${{ github.repository }}/front:sha-${short_sha}"
