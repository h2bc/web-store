schema: spec-driven

context: |
  ## What h2bc is
  Small Lithuanian streetwear brand (@_h2bc on Instagram and YouTube).
  Blackletter + pink visual identity. Sells its own apparel and
  accessories to Lithuania and the EU. Catalog, prices, regions and shipping rates
  are configured in the Medusa admin, not in code.

rules:
  proposal:
    - Short. One bullet per change, saying what and why.
    - Ask open questions only at the end, with the AskUserQuestion tool.
  design:
    - One paragraph per decision, naming the alternative considered
  tasks:
    - Split tasks by app. Do `api/` first when the storefront needs new endpoints.
    - Each group starts with its test task, naming the test file and its level per `.claude/rules/tests.md`.
    - A change that alters how the system works has a task updating `docs/architecture.md`.
    - The last task runs `pnpm lint`, `pnpm format`, `pnpm typecheck:api`, `pnpm typecheck:front` and `pnpm test:api`.
    - End with `## Review findings`, reading `None.` at plan time.
    - When a step happens outside the repo, add `## Outside this repo` with where it happens and the observable result that proves it.
    - Never edit a ticked task.

operations:
  apply:
    guidance:
      - Per task group, write the tests, run them, see them fail for the scenario's reason, implement, see them pass.
      - After each group run `pnpm lint`, `pnpm typecheck:api`, `pnpm typecheck:front` and `pnpm test:api`. Tick only when all are green.
      - A finding inside the task's scope re-does the task. One outside the change's scope goes under `## Review findings` in `tasks.md` with the task id.
      - Run an e2e file only when both apps are up.
      - A task under `front/app` or `front/components` ends with a Playwright MCP screenshot of the page saved under `.tmp/`, or the report says no page was loaded.
      - Leave the tree unstaged. Never commit or push.
  archive:
    guidance:
      - Run `/opsx:verify` first.
      - A CRITICAL finding stops the archive until it is fixed or logged under `## Review findings` in `tasks.md`.
      - List the verify warnings in the archive summary.
